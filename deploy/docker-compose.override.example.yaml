# Ajustes só para rodar na sua máquina.
# Copie para docker-compose.override.yaml: o Docker Compose carrega esse arquivo sozinho.
#   cp docker-compose.override.example.yaml docker-compose.override.yaml

services:
  mysql:
    ports:
      # acesso ao banco pelo Workbench/DBeaver (3307 para não conflitar com um MySQL local na 3306)
      - "3307:3306"

  backend:
    environment:
      SPRING_JPA_SHOW_SQL: "true"
