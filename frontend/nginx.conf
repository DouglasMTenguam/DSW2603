server {
  listen 4200;
  root /usr/share/nginx/html;
  index index.html;

  # O backend responde em /api/... e /auth/... (sem prefixo extra).
  # proxy_pass SEM barra no final repassa a URL original intacta.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /auth/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # rotas do Angular (refresh em /produtos, /estoque, etc.)
  location / {
    try_files $uri /index.html;
  }
}
